short_bio: >-
  I am a second-year PhD student at <a href="https://www.uga.edu/" target="_blank" rel="noopener">University of Georgia</a>, supervised by Distinguished Research Professor <a href="https://cobweb.cs.uga.edu/~tliu/" target="_blank" rel="noopener">Tianming Liu</a>. I am now working on Multi-modal Large Language Models and Medical Image Analysis. If you are seeking any form of <strong>academic cooperation</strong>, please feel free to email me at <a href="mailto:hanqi.jiang@uga.edu">hanqi.jiang@uga.edu</a> (UGA) or <a href="mailto:hjiang81@mgh.harvard.edu">hjiang81@mgh.harvard.edu</a> (MGH). My research focus is Quantum AI & Medical Image Analysis & Brain-inspired AI.
