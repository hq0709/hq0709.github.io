{% assign publications = include.publications | where_exp: "item", "item.status != 'preprint'" %}
<section class="publication-section" aria-labelledby="selected-publications-heading">
    <header class="publication-section-header">
        <h2 id="selected-publications-heading">Selected Publications</h2>
        <a href="{{ '/publications' | relative_url }}">All publications <i class="fas fa-arrow-right" aria-hidden="true"></i></a>
    </header>
    {% for item in publications limit:include.limit %}
        {% include widgets/publication_item.html item=item %}
    {% endfor %}
</section>
